<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			try {
				const t = localStorage.getItem('theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.classList.add('dark');
				}
			} catch (_) {}
		</script>
		<meta
			name="description"
			content="Interactive comparison of post-quantum signatures and KEMs across standardisation programmes (NIST PQC, the NIST on-ramp, China NGCC, KpqC and ISO): sizes, benchmarks and security findings."
		/>
		<meta property="og:title" content="NIST Signatures Zoo" />
		<meta
			property="og:description"
			content="Interactive comparison of post-quantum signatures and KEMs across standardisation programmes (NIST PQC, the NIST on-ramp, China NGCC, KpqC and ISO): sizes, benchmarks and security findings."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://pqshield.github.io/nist-sigs-zoo/" />
		<meta property="og:image" content="https://pqshield.github.io/nist-sigs-zoo/og-card.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="PQShield post-quantum signature and KEM zoo: NIST PQC, NIST on-ramp, China NGCC, KpqC, ISO"
		/>
		<meta property="og:site_name" content="NIST Signatures Zoo" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="NIST Signatures Zoo" />
		<meta
			name="twitter:description"
			content="Interactive comparison of post-quantum signatures and KEMs across standardisation programmes (NIST PQC, the NIST on-ramp, China NGCC, KpqC and ISO): sizes, benchmarks and security findings."
		/>
		<meta name="twitter:image" content="https://pqshield.github.io/nist-sigs-zoo/og-card.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
