name: HAWK
website: https://hawk-sign.info
category: Lattices
assumption: Lattice Isomorphism
versions:
- version: v1.1 (keygen update)
  date: '2025-07-04'
  status: On-ramp
  programmes:
    # selected as round-3 candidate 2026-05-14; withdrew 2026-07-29 but kept listed for historical record
    # round-3 code: hawk-sign/dev 1b9fef5 (2025-07-04, "Update keygen with new ntrugen code")
    nist-onramp: round-3
  perf_source: our benchmark
  broken: "Key-recovery reduces to SVP in dimension n/2+1 via a second Galois involution (Straznickas &amp; Weis, Anthropic, <a href=\"https://www-cdn.anthropic.com/e8d50c167ad47beeb03d6109a4a484be95cb38ea/hawk_key_recovery.pdf\">paper</a>), lowering key-recovery cost below the NIST level threshold for both parameter sets; the smaller HAWK-256 challenge parameter set was fully broken in practice (secret key recovered end-to-end in hours). The HAWK team withdrew the candidate from NIST's additional signature standardisation process on 2026-07-29 (<a href=\"https://groups.google.com/a/list.nist.gov/g/pqc-forum/c/2r2u6SbHun4/m/0_I2KOZ_CQAJ\">pqc-forum</a>): naïve fixes (doubling parameters or moving to higher-rank modules) make HAWK uncompetitive."
  parametersets:
  - name: '1024'
    level: 5
    pk: 2440
    sig: 1221
    signing_cycles: 182773
    verification_cycles: 186508
    signing_us: 48.2
    verification_us: 50.1
    bench_env: 2026-10-15-c8i.4xlarge
    notes: "Attack reduces key-recovery cost from 2^288 to 2^182 gates, below the Level 5 threshold"
  - name: '512'
    level: 1
    pk: 1024
    sig: 555
    signing_cycles: 80947
    verification_cycles: 90252
    signing_us: 22.4
    verification_us: 25.1
    bench_env: 2026-10-15-c8i.4xlarge
    notes: "Attack reduces key-recovery cost from 2^150 to 2^108 gates, below the Level 1 threshold (128 bits)"
