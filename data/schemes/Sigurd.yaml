  implementation: The submitted code leaks the signing witness through its encoding after a handful of signatures (<a href="https://ngcc.dev/reports/sign-24.html#sign-24-1-chunked-reedsolomon-encoding-reveals-the-signing-witness">Guoxiao Liu</a>; <a href="https://groups.google.com/a/list.nist.gov/g/pqc-forum/c/2lO14yYyDK4/m/UYKYkWM7BAAJ">Feussner</a>; <a href="https://ngcc.dev/reports/sign-24.html#sign-24-1-chunked-reedsolomon-encoding-reveals-the-signing-witness">Saarinen</a>), and through occasional zero challenges, enabling forgery at every level (<a href="https://ngcc.dev/reports/sign-24.html#sign-24-2-zero-16-bit-challenge-exposes-the-signing-witness">Saarinen</a>).
