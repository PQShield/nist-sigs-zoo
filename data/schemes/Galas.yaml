  implementation: The submitted signing code seeds its generator with a fixed value, so anyone can regenerate a victim's secret key (<a href="https://ngcc.dev/reports/sign-12.html#sign-12-1-publicly-reproducible-signing-keys">Saarinen</a>). A 32-bit length truncation also allows forgeries on long messages (<a href="https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/7GPLR732HEXNMYOT37KSQDVDVHIRR2GH/">pq-CUC</a>).
