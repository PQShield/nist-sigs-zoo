  implementation: The submitted code omits a nonce when sampling secrets, collapsing them to one value and making key recovery cheap (Sun). Signatures are also trivially malleable (Saarinen).
  broken: The verifier ignores the signs of challenge coefficients, allowing universal forgery below every claimed level (Kwiatkowski). Compressed CS-128 signatures leak an equivalent signing key (Lu et al.).
