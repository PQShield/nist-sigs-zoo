  broken: 'Public-key-only universal forgery: in the BN++ relation for the inverse Mersenne S-boxes of AIM2, t^(2^e) + γt = pt·t, a zero S-box output t satisfies the equation for any pt, so anyone can build a witness that is not an AIM2 preimage and sign arbitrary messages under every honest key of every parameter set (<a href="https://eprint.iacr.org/2026/2235">Liu, Peng, Liu, Jia, Wang, Wang &amp; Fan</a>, confirmed by the AIMer team). The paper demonstrates it on the January 2026 AIM2 specification, which uses the same relation as v2.0 and v2.1. Separately, AIM2 itself is below its claimed security: key recovery in 2^103.7/2^147.5/2^213.2 for AIM2-I/III/V, practical with reused or related keys (<a href="https://eprint.iacr.org/2026/903">Biryukov, García Fernández &amp; Udovenko</a>, EUROCRYPT 2026). Fixed in v3.0 (AIM3).'
