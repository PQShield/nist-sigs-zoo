  warning: 'The AIM one-way function falls short of its claimed security: <a href="https://eprint.iacr.org/2023/1133">Liu, Mahzoun, Øygarden &amp; Meier</a> (ToSC 2023(4)) recover the key of full AIM-I/III/V with about 2^115/2^178/2^241 AIM evaluations, using equivalent representations and fast exhaustive search, and <a href="https://eprint.iacr.org/2023/1397">Zhang, Wang, Yu, Guo &amp; Cui</a> (ASIACRYPT 2023) attack AIM-III in 2^186.5. Replaced by AIM2 in v2.0.'
