  info: 'v3.0 replaces AIM2 with AIM3. The earlier AIM2-based versions, v2.0 and v2.1 (the version KpqC selected), are broken by a public-key-only universal forgery (<a href="https://eprint.iacr.org/2026/2235">Liu et al.</a>); the AIM cipher of v1.0 falls short of its claimed security (<a href="https://eprint.iacr.org/2023/1133">Liu, Mahzoun, Øygarden &amp; Meier</a>). We list v3.0 as the KpqC selection, expecting KpqC to adopt it.'
