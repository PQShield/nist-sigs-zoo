  findings_url: https://ngcc.dev/reports/sign-15.html
  implementation: In the submitted code, repeated masking coefficients let two signatures reveal the key (<a href="https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/L5UNKA72RZ2TBTCKZYIVJ5KFDU6XTWFB/">Lu and Liu</a>; for the 512-bit set via overlapping mask streams, <a href="https://ngcc.dev/reports/sign-15.html#sign-15-13-overlapping-mask-streams-recover-the-atlas-512-signing-key">Saarinen</a>), signatures are malleable (<a href="https://ngcc.dev/reports/sign-15.html#sign-15-2-trivial-hint-padding-malleability-violates-suf-cma">Saarinen</a>), and crafted hints cause out-of-bounds accesses (<a href="https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/QUKIQWX7B5D2UYVTGSZ3JC6IVELQWA2Q/">Song-Anxiao</a>).
  broken: The specified 128-bit set leaks its key from millions of signatures (<a href="https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/3BUUSX5DBW37Y35QAEXA53ZAEU3JBDET/">Feussner</a>), and the higher sets have challenge spaces, digests or seeds too small for their targets (<a href="https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/6UCTMUFIYLOOSNAC7EAMPVCVANTUTFEO/">Xiong and Wang</a>).
