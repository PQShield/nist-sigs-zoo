  info: "The round-3 vinegar sampler reduces uniform bytes modulo q^g, which is biased for odd q; Beullens &amp; Hess recover secret keys from signatures for the six odd-characteristic alternative parameter sets (LPN/BKW attack, to appear on ePrint). The recommended sets below use q = 16 and are unaffected. Easily fixed by sampling vinegar uniformly."
