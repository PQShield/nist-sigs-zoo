name: SNOVA
website: http://snova.pqclab.org/
category: Multivariate
assumption: Non-comm. Ring UOV
versions:
- version: v3.0
  date: '2026-08-31'
  status: On-ramp
  programmes:
    nist-onramp: round-3
  perf_source: our benchmark
  info: "The round-3 vinegar sampler reduces uniform bytes modulo q^g, which is biased for odd q; <a href=\"https://groups.google.com/a/list.nist.gov/d/msgid/pqc-forum/000001dd4a73%247e3c04e0%247ab40ea0%24%40beullens.com\">Beullens &amp; Hess</a> recover secret keys from signatures for the six odd-characteristic alternative parameter sets (LPN/BKW attack, to appear on ePrint). The recommended sets below use q = 16 and are unaffected. Easily fixed by sampling vinegar uniformly."
  # recommended: round-3 spec v3.0 §1.9.1 Table 5 "Recommended parameter sets"; §1.9.2 Table 6 lists "Alternative SNOVA parameter sets" whose "security margins are less conservative than those of the recommended parameter sets" (https://csrc.nist.gov/csrc/media/Projects/pqc-dig-sig/documents/SNOVA_specifications.pdf)
