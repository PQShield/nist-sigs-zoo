# Assumption also uses BSTMSIS (spec Sec. 3). No recommended set.
- id: sign-07
  kind: signature
  name: CS
  file: CS
  website: https://www.niccs.org.cn/niccs/Round1Additional/pc/content/content_2101561077046792192.html
  category: Lattices
  assumption: MLWE/MSIS
  spec: Algorithm specifications/CS.pdf
  findings:
    url: https://ngcc.dev/reports/sign-07.html
    implementation: "The submitted code omits a nonce when sampling secrets, collapsing them to one value and making key recovery cheap (Sun). Signatures are also trivially malleable (Saarinen)."
    broken: "The verifier ignores the signs of challenge coefficients, allowing universal forgery below every claimed level (Kwiatkowski). Compressed CS-128 signatures leak an equivalent signing key (Lu et al.)."
    sources:
      - https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/2OEX5VKCOX3NZV2DFKG3DF7B3OA6Z3FC/
