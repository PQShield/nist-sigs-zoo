# China NGCC round-1 candidates: claims curated from each official specification.
# Source of truth for data/schemes/<file>.yaml and data/kems/<file>.yaml (generated by
# bench/update_scheme_data.py and bench-kem/update_scheme_data.py --ngcc-sizes).
#
# Per candidate: id, kind (signature|kem), name (official), file (YAML basename),
# website (official NICCS page), category (site family), assumption (short), spec
# (path of the specification PDF inside the submission archive), instances.
# Per instance: instance (= ALGORITHM_INSTANCE, as in <suite>/schemes/ngcc/params.tsv),
# ref (spec section/table/page for the claim), and either
#   ngcc_level: 128|256|384|512   the NGCC target the submitters assign the instance to
#   recommended: true             only where the spec designates it for its target
# or
#   omit: "<reason>"              not shown on the site (e.g. an intermediate 192-bit set)
# Optional: pk, sig|ct, size_ref (spec table/page); for instances we cannot build these are the
# published sizes, for built ones (optional sk too) they are a cross-check: where our measured
# size differs the YAML note cites the spec value.
#
# findings (optional, per candidate): url (its ngcc.dev security report), optional
# implementation (bugs in the submitted code) / broken (design attacks below the claimed
# target) summaries, and sources (https URLs: the primary publication of each summarised
# finding as linked by ngcc.dev, else the ngcc.dev report). Per instance, implementation /
# broken where a finding only concerns some parameter sets. Summaries are in our own words
# (max 280 characters); each claim ends with its original authors in parentheses, as
# attributed by ngcc.dev ("(A)", "(A and B)", "(A et al.)"; independent discoverers separated
# by ";"). No ngcc.dev numbers, sizes or timings are imported.
#
# Sources: the official specifications only. ngcc.dev data is never copied here.
#
# Curation rules: ngcc_level is the NGCC target the submitters say the instance is designed
# to meet (128/256/512 required, 384 optional), read from the spec's parameter/security
# table; a set with another bit-security estimate goes to the target the submitters assign
# it to, or is omitted if they assign none. recommended only where the spec designates a
# recommended/primary/default set. Families: lattice -> Lattices; codes -> Code-based;
# UOV/MQ -> Multivariate; hash-based or MPCitH/VOLEitH over a block cipher or hash ->
# Symmetric; MPCitH/VOLEitH over another hard problem -> MPCitH; isogenies -> Isogenies;
# anything else -> Other. Implementation variants of one parameter set (Sigurd _REF/_OPT,
# ZEN_SWIFT_*) are one instance here; their source names are kept in comments for Task 9.
# "FOR THOM" comments mark judgement calls awaiting review.

# Spec names the sets PARAMS I/II/III, 'targeted >=128/256/512 classical bits' (Sec. 4). Instance names as in the source tree; cross-check CSV (Aigis-sig1/2/3) uses other names. No recommended set designated.
- id: sign-01
  kind: signature
  name: Aigis-Sig+
  file: Aigis-Sig-plus
  website: https://www.niccs.org.cn/niccs/Round1Additional/pc/content/content_2101567126852161536.html
  category: Lattices
  assumption: MLWE/MSIS
  spec: Algorithm specifications.pdf
  findings:
    url: https://ngcc.dev/reports/sign-01.html
    implementation: "Submitted code accepts altered copies of valid signatures and lets malformed hints write out of bounds on the stack (Saarinen). Its challenge sampler gives sets I and II far too little sign entropy (Yijian Liu)."
    sources:
      - https://ngcc.dev/reports/sign-01.html
      - https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/PKKXNPUY433TLJHGCS365LENBN75SHAZ/
      - https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/PT5IXZ64ERV2IJY355ZM7ZFTMSJZGRB2/
  instances:
    - instance: Aigis-Sig+-I
      ngcc_level: 128
      ref: "Sec. 4, Table 1 and Table 2 (PDF p. 18)"
    - instance: Aigis-Sig+-II
      broken: "The specified message digest is too short for this set, so a generic collision moves a signature to another message with less work than the claimed level (Sun)."
      ngcc_level: 256
      ref: "Sec. 4, Table 1 and Table 2 (PDF p. 18)"
    - instance: Aigis-Sig+-III
      broken: "The specified message digest is too short for this set, so a generic collision moves a signature to another message with less work than the claimed level (Sun)."
      ngcc_level: 512
      ref: "Sec. 4, Table 1 and Table 2 (PDF p. 18)"
# Spec Table 1/10 also describe 80/192/384-bit sets 'for other application scenarios'; only 384 is an NGCC (optional) target. 384 has no code in the archive (inventory lists 128/256/512 only).
- id: sign-02
  kind: signature
  name: BiT
  full_name: "BIT: Bimodal Triangular distribution based lattice signatures"
  file: BiT
  website: https://www.niccs.org.cn/niccs/Round1Additional/pc/content/content_2101561076358926336.html
  category: Lattices
  assumption: MLWE/MSIS
  spec: Algorithm specifications.pdf
  findings:
    url: https://ngcc.dev/reports/sign-02.html
    sources:
      - https://groups.google.com/a/list.nist.gov/g/pqc-forum/c/84_EKMOtk_M/m/ZNMqLQ07BAAJ
      - https://ngcc.dev/reports/sign-02.html
  instances:
    - instance: BiT-128
      broken: "Equivalent signing keys can be recovered from a large but practical number of public signatures, enabling forgeries (Feussner)."
      ngcc_level: 128
      ref: "Sec. 6.3, Table 9 (PDF p. 34)"
    - instance: BiT-256
      ngcc_level: 256
      ref: "Sec. 6.3, Table 9 (PDF p. 34)"
    - instance: BiT-512
      broken: "The unsalted 512-bit message digest limits forgery resistance to about 2^256 work, below the 512-bit target (Saarinen)."
      ngcc_level: 512
      ref: "Sec. 6.3, Table 9 (PDF p. 34)"
    # Not built (no implementation in the archive); instance name follows the spec pattern.
    - instance: BiT-384
      ngcc_level: 384
      ref: "Sec. 6.3, Table 10 (PDF p. 35); Sec. 1, Table 1"
      pk: 2435
      sig: 5251
      size_ref: "Sec. 6.3, Table 10 (PDF p. 35)"
    - instance: BiT-80
      omit: "80-bit set; not an NGCC target (spec Sec. 6.3, Table 10, PDF p. 35); not built"
      ref: "Sec. 6.3, Table 10 (PDF p. 35)"
    - instance: BiT-192
      omit: "Intermediate 192-bit set; not an NGCC target (spec Sec. 6.3, Table 10, PDF p. 35); not built"
      ref: "Sec. 6.3, Table 10 (PDF p. 35)"
