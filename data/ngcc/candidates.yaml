- id: kem-08
  kind: kem
  name: BW-KEM
  file: BW-KEM
  website: https://www.niccs.org.cn/niccs/Round1Additional/pc/content/content_2101560843877044224.html
  category: Lattices
  assumption: MLWE
  spec: Algorithm specifications/Algorithm specifications.pdf
  findings:
    url: https://ngcc.dev/reports/kem-08.html
  instances:
    # inventory also lists *_AVX2 dirs: optimized implementations of the same sets, not instances
    # The spec §7.1 says "three parameter sets" (c128/c256/c512) but §6.2 Table 2 lists four recommended sets
    # (incl. c384) plus four "-s" alternatives; the submission code builds only C128/C256/C512.
    - instance: BW_KEM_C128
      ngcc_level: 128
      recommended: true
      ref: "§6.2 Table 2 'Recommended parameter sets' BW-KEM-c128 (PDF p. 28)"
    - instance: BW_KEM_C256
      ngcc_level: 256
      recommended: true
      ref: "§6.2 Table 2 'Recommended parameter sets' BW-KEM-c256 (PDF p. 28)"
    - instance: BW_KEM_C384
      ngcc_level: 384
      recommended: true
      ref: "§6.2 Table 2 'Recommended parameter sets' BW-KEM-c384 (PDF p. 28)"
      pk: 2368
      ct: 2176
      size_ref: "§6.2 Table 2, BW-KEM-c384 (PDF p. 28); not built in the submission"
    - instance: BW_KEM_C512
      ngcc_level: 512
      recommended: true
      ref: "§6.2 Table 2 'Recommended parameter sets' BW-KEM-c512 (PDF p. 28)"
    # The four "-s" (strengthened, lower-DFR) variants are same-target alternatives not in the code; omitted.
    - instance: BW_KEM_C128_S
      omit: "Alternative '-s' variant (higher compression widths) of the recommended c128 set; not in the submission code (spec §6.2 Table 2, PDF p. 28)"
      ref: "§6.2 Table 2 'Strengthened parameter sets' (PDF p. 28)"
    - instance: BW_KEM_C256_S
      omit: "Alternative '-s' variant of the recommended c256 set; not in the submission code (spec §6.2 Table 2, PDF p. 28)"
      ref: "§6.2 Table 2 'Strengthened parameter sets' (PDF p. 28)"
    - instance: BW_KEM_C384_S
      omit: "Alternative '-s' variant of the recommended c384 set; not in the submission code (spec §6.2 Table 2, PDF p. 28)"
      ref: "§6.2 Table 2 'Strengthened parameter sets' (PDF p. 28)"
    - instance: BW_KEM_C512_S
      omit: "Alternative '-s' variant of the recommended c512 set; not in the submission code (spec §6.2 Table 2, PDF p. 28)"
      ref: "§6.2 Table 2 'Strengthened parameter sets' (PDF p. 28)"

