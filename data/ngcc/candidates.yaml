  instances:
    - instance: CS-128
      ngcc_level: 128
      ref: "Sec. 3.5, Table 3 (PDF p. 24); Sec. 5, Table 4 (PDF p. 33)"
    - instance: CS-256
      ngcc_level: 256
      ref: "Sec. 3.5, Table 3 (PDF p. 24); Sec. 5, Table 4 (PDF p. 33)"
    - instance: CS-512
      ngcc_level: 512
      ref: "Sec. 3.5, Table 3 (PDF p. 24); Sec. 5, Table 4 (PDF p. 33)"
