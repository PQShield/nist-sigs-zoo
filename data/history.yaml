- date: '2026-09-08'
  type: update
  description: "SDitH round-3 update (v3.0.0, <a href=\"https://github.com/sdith/sdith/releases/tag/v3.0.0\">github.com/sdith/sdith</a>): the VOLEitH-based construction gets minor signature-size growth across all six gf2 parameter sets (Category I short/fast: 3705&rarr;3721 / 4484&rarr;4914 bytes; III: 7964&rarr;8484 / 9916&rarr;10852; V: 14121&rarr;15147 / 17540&rarr;19144), public-key sizes unchanged. Sizes verified against the tag's kat_r3 KAT vectors; no reference-hardware benchmark numbers available yet. A separate CIPHERPOW build variant is also introduced but not yet tracked here."
  schemes: [SDitH]

- date: '2026-09-07'
  type: update
  description: "UOV round-3 parameter update (<a href=\"https://github.com/pqov/pqov/commit/f82ec0a9\">pqov/pqov</a>): grows n at Levels I and III (Ip: n 112&rarr;119, m 44&rarr;45; III: n 184&rarr;193, m unchanged) and Level V (n 244&rarr;259, m unchanged), and adds a GFNI-optimized backend. Expanded-pk and signature sizes grow accordingly (compact-pk sizes are unchanged where m stayed fixed); Is (Level I, GF(16)) parameters are untouched. Not yet reflected on uovsig.org, which still serves the Feb-2025 round-2 package. Whether this fully re-addresses the intersection attack (Furue &amp; Ikematsu, ePrint 2026/298) at the new parameter sizes has not been independently re-analyzed, so existing broken/warning flags are carried forward unchanged pending that analysis."
  schemes: [UOV]

- date: '2026-09-01'
  type: update
  description: "SQIsign 3.0 released as the third-round submission spec: parameters revised in response to the improved supersingular isogeny-problem algorithm (ePrint 2026/1486), and the reference implementation drops its GMP dependency for a from-scratch fixed-precision integer library. Public key and signature sizes grow (level I: 65/148 &rarr; 83/200 bytes; level III: 97/224 &rarr; 129/306; level V: 129/292 &rarr; 169/406 bytes), and both signing and verification are considerably faster than v2.0.1."
  schemes: [SQIsign]

- date: '2026-09-01'
  type: update
  description: "FAEST v3.0.0 released (<a href=\"https://github.com/faest-sign/faest-ref/releases/tag/v3.0.0\">release notes</a>), the round-3 spec update. It restructures the VOLE-commitment construction around a new CRT-based scheme and, per <a href=\"https://github.com/faest-sign/faest-ref/issues/18\">issue #18</a>, aligns the spec text for the first Fiat-Shamir challenge (<code>chall_1</code>) with what the implementation already computed (no forgery or key-recovery &mdash; a transcript-binding clarification). Signature sizes shrink by roughly 10&ndash;15% across all parameter sets (e.g. 128s: 4506&rarr;4066 bytes, 256f: 26548&rarr;20856 bytes); public-key sizes are unchanged. v2.0 is not broken, just superseded as the pinned round-3 submission."
  schemes: [FAEST]

- date: '2026-08-31'
  type: update
  description: "SNOVA 3.0 (round-3 submission) reformulates the public map to support rectangular signature matrices, extending the scheme to seven parameters (v, o, q, l, r, m1, m2) and adding parameter sets over odd-characteristic fields. The recommended parameter sets (SNOVA_{I,III,V}_{K,B,S}) replace the previous v2.3 candidates; per the spec's security analysis (Tables 9&ndash;11), the Wedge product attack (Bros et al., ePrint 2026/237) that flagged several v2.3 parameter sets as broken/warning no longer applies to the reformulated public map. The &ldquo;Expanded Secret Key&rdquo; option is removed; only seeded secret keys remain."
  schemes: [SNOVA]

- date: '2026-08-31'
  type: update
  description: "MQOM v3.0 released (round-3 spec): adds a One-Tree (OT) BLC variant alongside the existing Correlated-Tree (CT) one (tighter security reduction to the MQ problem, similar sizes, less implementation-friendly), a new gf2-shorter variant, and drops the gf256 and three-round (*-r3) variants, leaving 18 parameter sets (3 tradeoffs &times; 2 BLC variants &times; 3 categories). Fixes the salt-less GGM root-expansion issue below (<a href=\"https://eprint.iacr.org/2026/1542\">ePrint 2026/1542</a>) via domain-separated root expansion, confirmed in the spec's changelog &mdash; the v2.1 warning is dropped for v3.0. Also expands F16 parameters for additional security margin and adds ARM NEON optimized implementations."
  schemes: [MQOM]

- date: '2026-08-07'
  type: attack
  description: "Passive full-key-recovery attack on MQOM v2 (Delgado, <a href=\"https://eprint.iacr.org/2026/1542\">ePrint 2026/1542</a>): the v2.x spec derives correlated GGM roots from a fresh master seed via a fixed, zero-salt PRG call (Algorithm 10), so repeated seeds across signatures, keys, and salts leak linear equations in the MQ witness. A parity-indexed XOR-collision attack recovers the complete signing key, but requires signature/query volumes at NIST's outer Q=2^64 permitted bound (~39% success in Category I) or substantial precomputation (tens of GiB&ndash;PiB of tables) to push higher; affects Categories I, III, and V, verified against every official tag from v2.0.0 through v2.1.1. Fix: salt-bound, domain-separated root expansion. v1.0 unaffected. Flagged as warning."
  schemes: [MQOM]

- date: '2026-07-29'
  type: milestone
  description: "The HAWK team withdrew HAWK from NIST's additional signature standardisation process, citing the key-recovery attack below: naïve fixes such as doubling parameters or moving to higher-rank modules make HAWK uncompetitive with other lattice signatures. NIST confirmed the withdrawal and updated the <a href=\"https://csrc.nist.gov/Projects/pqc-dig-sig/round-3-additional-signatures\">round-3 candidates page</a> accordingly. <a href=\"https://groups.google.com/a/list.nist.gov/g/pqc-forum/c/2r2u6SbHun4/m/0_I2KOZ_CQAJ\">pqc-forum announcement</a>."
  schemes: [HAWK]

- date: '2026-07-29'
  type: attack
  description: "Deterministic key-recovery attack (Straznickas &amp; Weis, Anthropic, <a href=\"https://www-cdn.anthropic.com/e8d50c167ad47beeb03d6109a4a484be95cb38ea/hawk_key_recovery.pdf\">paper</a>) reduces HAWK-n key recovery to poly(n) calls to an exact-SVP oracle in dimension n/2+1, using a second Galois involution (τ: ζ↦−ζ) beyond the complex conjugation prior module-LIP attacks relied on. Lowers key-recovery cost from 2^150 to 2^108 gates (HAWK-512) and from 2^288 to 2^182 gates (HAWK-1024), both below their NIST level thresholds. The smaller HAWK-256 challenge parameter set was fully broken in practice: secret key recovered end-to-end in a few hours on a single 96-core server. Falcon is unaffected. Flagged as broken."
  schemes: [HAWK]

- date: '2026-07-26'
  type: attack
  description: "Improved algorithm for the supersingular isogeny problem (<a href=\"https://eprint.iacr.org/2026/1486\">ePrint 2026/1486</a>) achieves time/memory p^{1/3+o(1)}, down from the previous best p^{1/2}. Relies on an unproven heuristic smoothness assumption and has a superpolynomial overhead plus high memory cost; concrete impact on SQIsign's parameters not yet clarified. Flagged as warning."
  schemes: [SQIsign]

- date: '2026-07-02'
  type: update
  description: "Added SMAUG-T (finalist algorithm selected in Korea's KpqC competition) to the KEMs comparison page, with benchmarked keygen/encaps/decaps timings for SMAUG-T128, SMAUG-T192, and SMAUG-T256."
  schemes: [SMAUG-T]

- date: '2026-07-02'
  type: update
  description: "Added NTRU+ (finalist algorithm selected in Korea's KpqC competition) to the KEMs comparison page, with benchmarked keygen/encaps/decaps timings for NTRU+768, NTRU+864, and NTRU+1152."
  schemes: [NTRU+]

- date: '2026-07-02'
  type: update
  description: "Added SABER (NIST round-3 finalist, not selected) to the KEMs comparison page, with benchmarked keygen/encaps/decaps timings for LightSaber, Saber, and FireSaber."
  schemes: [SABER]

- date: '2026-07-01'
  type: update
  description: "Published a standalone KEMs comparison page — public-key and ciphertext sizes plus keygen/encaps/decaps benchmarks for ML-KEM, HQC, and classical ECDH."

- date: '2026-06-04'
  type: attack
  description: "Improved MQ attack (Asanuma, Chen, Furue, Sakata &amp; Takagi, <a href=\"https://eprint.iacr.org/2026/1054\">ePrint 2026/1054</a>) reduces MAYO1 classical security estimate from 2^156 to 2^145. Still above NIST Level I threshold (128 bits); flagged as warning."
  schemes: [MAYO]

- date: '2026-05-26'
  type: update
  description: "Updated FAEST performance data to use the AVX2+AES-NI optimized implementation (<a href=\"https://github.com/faest-sign/faest-arch-opt\">faest-arch-opt</a>) instead of the reference implementation. Signing is 10–100× faster depending on the parameter set."
  schemes: [FAEST]

- date: '2026-05-26'
  type: update
  description: "Updated SNOVA to v2.3 (2026-04-03). Split round-2 and round-3 data: round-3 now shows the 14 current parameter sets from the v2.3 spec (l=4 variants retained with warnings, new q=19 variants, rectangular 4×5 structure added per \"Rectangular signatures\" update)."
  schemes: [SNOVA]

- date: '2026-05-14'
  type: milestone
  description: "NIST announced 9 Round 3 candidates for additional post-quantum signature schemes: FAEST, HAWK, MAYO, MQOM, QR-UOV, SDitH, SNOVA, SQIsign, UOV. Rationale in <a href=\"https://csrc.nist.gov/pubs/ir/8610/final\">NIST IR 8610</a>. <a href=\"https://csrc.nist.gov/projects/pqc-dig-sig/round-3-additional-signatures\">Round 3 candidates</a>."
  schemes: [FAEST, HAWK, MAYO, MQOM, QR-UOV, SDitH, SNOVA, SQIsign, UOV]

- date: '2026-05-09'
  type: attack
  description: "Updated UOV security flags based on pℓ-truncated polynomial ring intersection attack (Furue &amp; Ikematsu, <a href=\"https://eprint.iacr.org/2026/298\">ePrint 2026/298</a>). Improves on Ran's wedge attack for Ip (~128 bits), III (~182 bits), V (~223 bits). Is parameter sets newly flagged as warning (~159 bits, still above threshold)."
  schemes: [UOV]

- date: '2026-05-09'
  type: attack
  description: "Updated UOV and MAYO security flags based on wedge attack (Ran, <a href=\"https://eprint.iacr.org/2025/1143\">ePrint 2025/1143</a>). MAYO-2 (\"two\") marked broken (~113 bits, below 128-bit threshold). UOV Ip, III, and V parameter sets marked with warning (reduced but still above threshold). UOV Is unaffected."
  schemes: [UOV, MAYO]

- date: '2026-05-09'
  type: attack
  description: "Updated SNOVA security flags based on wedge product attack (Bros et al., <a href=\"https://eprint.iacr.org/2026/237\">ePrint 2026/237</a>). 6 parameter sets marked broken: (37 17 2), (25 8 3), (56 25 2), (24 5 5), (75 33 2), (29 6 5). 2 parameter sets marked with warning: (24 5 4), (37 8 4)."
  schemes: [SNOVA]

- date: '2026-05-08'
  type: update
  description: Updated 7 schemes to their latest published specifications. PERK redesigned parameter sets (v2.2.0). MQOM adds gf16 variants (v2.1). RYDE and Mirath corrected signature sizes and added faster variants. CROSS, SQIsign, and MAYO updated with revised benchmarks.
  schemes: [CROSS, MAYO, MQOM, Mirath, PERK, RYDE, SQIsign]

