- date: '2026-10-15'
  type: update
  description: "Re-benchmarked every signature and KEM on AWS c8i.4xlarge (Intel Xeon 6975P-C, core cycles via rdpmc), replacing the c7i.4xlarge timings of 2026-10-13. This also times for the first time the C++ optimised builds of Lynxer, ReSolveD-&alpha; and SYDO, the SNOVA, SDitH and SMAUG-T alternative sets, and the SP 800-230 SLH-DSA-SHAKE-*-24 sets, which are exempt from our 10-minute limit: one signature takes 6.6&ndash;11.3 minutes. TRINE-512-Balanced still exceeds the limit."

- date: '2026-10-14'
  type: update
  description: "Lynxer, ReSolveD-ɑ and SYDO are now built from their submitted optimised x86 implementations (C++ with AVX2) instead of the reference code. The optimised builds reproduce the submitted test vectors and give the same key and signature sizes. Their earlier timings came from the reference code and are removed until our next benchmark run. Galas stays on its reference code, because its optimised code has no implementation of the NGCC signature interface."
  programmes: [china-ngcc]
  schemes: [Lynxer, ReSolveD-ɑ, SYDO]

- date: '2026-10-14'
  type: update
  description: "Added alternative and additional parameter sets for which official code exists; the main sets are marked, so the Recommended filter hides the new ones. <strong>SLH-DSA:</strong> the three SHAKE sets of the <a href=\"https://doi.org/10.6028/NIST.SP.800-230.ipd\">NIST SP 800-230 initial public draft</a> (13 April 2026), SHAKE-128-24, SHAKE-192-24 and SHAKE-256-24, limited to 2<sup>24</sup> signatures per key, with 3,856, 7,752 and 14,944-byte signatures (Table 1). The draft is not final. We build them from the experimental SP 800-230 support in <a href=\"https://github.com/pq-code-package/slhdsa-c/pull/51\">slhdsa-c PR #51</a> (not yet merged). The code of the FIPS 205 sets in our benchmark moved to that commit too; compared with before it adds a signature-length check in verification and larger stack buffers, and the algorithms are unchanged. Without a cached hypertree, key generation and each signature rebuild a 2<sup>21</sup>&ndash;2<sup>22</sup>-leaf tree and take minutes. <strong>SDitH:</strong> the six v3.0 instances with cipher-based grinding (<a href=\"https://github.com/sdith/sdith/blob/v3.0.0/docs/sdith-v3.0.pdf\">specification</a> Table 5, *-cipherpow), from the v3.0.0 code we already benchmark; the L1 and L3 fast instances have 4,643 and 10,452-byte signatures, the others match the main instances. <strong>SMAUG-T:</strong> TiMER, the additional level-1 parameter set of the <a href=\"https://hmchoe0528.github.io/assets/manuscripts/SMAUG_T_spec_Oct24_v4.0.pdf\">v4.0 specification</a> (672-byte public key, 608-byte ciphertext), from its AVX2 implementation in the SMAUG-T code we already benchmark. Timings for the new sets follow from our next benchmark run. Mirath-v, Mirath KeyGen2 and RYDE-v are not added because their code has not been published."
  schemes: [SLH-DSA, SDitH, SMAUG-T]

- date: '2026-10-14'
  type: update
  description: "Where a specification lists alternative or additional parameter sets next to its main ones, the main sets are now marked, so the Recommended filter hides the alternatives: SNOVA, MAYO, QR-UOV, SQIsign and FAEST (FAEST-EM is the specification's alternative variant), and the NGCC KEMs DTRU (DTRU-Light and DTRU-Prime are the alternatives to the primary tricyclotomic sets) and MAMBA-Frost (the compact-ciphertext CC variants are additional to the default sets). The round-3 specifications of SNOVA (Table 6), MAYO (Table 2.2), QR-UOV (Appendix B) and SQIsign (Appendix P) also list alternative or additional parameter sets; these are now shown under All parameter sets, with sizes from the specifications. The six odd-characteristic SNOVA alternatives are marked broken by Beullens &amp; Hess's vinegar-bias attack."
  schemes: [SNOVA, MAYO, QR-UOV, SQIsign, FAEST, DTRU, MAMBA-Frost]

- date: '2026-10-14'
  type: update
  description: "ISO/IEC 18033-2:2006/Amd 2:2026, published in June 2026, standardises FrodoKEM and Classic McEliece (the latter without mceliece348864). Both are now shown as ISO standards, and the ISO programme as completed."
  programmes: [iso]
  schemes: [FrodoKEM, Classic McEliece]

- date: '2026-10-13'
  type: update
  description: "Benchmarked the round-1 candidates of China's NGCC programme on our own harness (AWS c7i.4xlarge, Intel Xeon Platinum 8488C, core cycles via rdpmc): 178 signature and 160 KEM parameter sets. Tins128/256/512 fail our sign/verify checks and are shown as not finished. We do not benchmark parameter sets that need more than 10 minutes for one signature or verification (TRINE-512-Balanced) or hours for key generation (UVW-512). A few submissions needed small fixes to their own code to run reliably; each is noted on the parameter set. The signature run also refreshes the timings of the NIST on-ramp schemes."
  programmes: [china-ngcc]

- date: '2026-10-08'
  type: update
  description: "Added the 34 signature and 41 KEM candidates of round 1 of China's NGCC programme (ICCS). Parameter sets and sizes come from our own builds of the official submission packages through the ICCS API, and claimed security targets from each specification. NGCC security targets (128, 256, 384 and 512 bits) are the programme's own scale and are not NIST levels. Timings follow once our benchmarks have run."
  programmes: [china-ngcc]

- date: '2026-10-07'
  type: update
  description: "Every signature scheme and KEM now has its own page, with its programmes, parameter sets, security flags, a version-by-version comparison of sizes and cycle counts, and its slice of this history. Scheme names in the tables and points in the charts link to it."
