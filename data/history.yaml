- date: '2026-09-27'
  type: attack
  description: "Public-key-only universal forgery on AIM2-based AIMer (Liu, Peng, Liu, Jia, Wang, Wang &amp; Fan, <a href=\"https://eprint.iacr.org/2026/2235\">ePrint 2026/2235</a>): BN++ checks each inverse Mersenne S-box of AIM2 through the quadratic relation t^(2^e) + &gamma;t = pt&middot;t, which holds for any pt when the S-box output t is zero. Setting all first-layer outputs to zero and pt = ct + b^(2^e*&minus;1), computed from the public key alone, gives a witness that satisfies every checked equation without being an AIM2 preimage; the unmodified prover then signs any message, with probability one, for every honest key of every parameter set. Forgeries were accepted by the unmodified reference verifier for AIMer-128f/192f/256f (about 11.6 ms per AIMer-256f forgery). The paper attacks the January 2026 AIM2 specification; v2.0 and v2.1 use the same relation, so we mark them broken. The AIMer team confirmed the attack, and the AIM3 relation of v3.0 rules out the zero branch. The paper also forges signatures for some Lynxer variants. v1.0 (AIM) is not covered by the paper."
  schemes: [AIMer]

- date: '2026-09-22'
  type: attack
  description: "Key-recovery attack on SNOVA's biased vinegar sampling (Beullens &amp; Hess, IBM Research, <a href=\"https://groups.google.com/a/list.nist.gov/d/msgid/pqc-forum/000001dd4a73%247e3c04e0%247ab40ea0%24%40beullens.com\">pqc-forum OFFICIAL COMMENT</a>, paper to appear on ePrint): the round-3 signer draws vinegar variables by reducing uniform byte strings modulo q^g, which is never uniform when q is odd, so every signature yields noisy linear equations in the secret transformation T. Key recovery becomes a q-ary LPN problem with a known full-support error distribution, solved with BKW reduction plus Fourier hypothesis testing. This affects only the <strong>six odd-characteristic alternative parameter sets</strong> of Table 6 in the round-3 spec &mdash; (27 4 19 4 6), (27 5 13 4 4), (39 5 11 4 6), (38 5 19 4 6), (40 5 19 5 6) and (47 6 19 4 6) &mdash; all of which fall far below their claimed 170&ndash;331 bits (2^90&ndash;2^130 operations from ~6&ndash;11k signatures). Four were broken end to end against the unmodified reference implementation: 9M, 16.5M, 9M and 180M signatures recovered in 22s, 34s, 22s and 16min respectively (<a href=\"https://github.com/WardBeullens/SNOVA_LPN_Attack\">proof of concept</a>). <strong>The recommended parameter sets shown here (SNOVA_{I,III,V}_{K,B,S}) use q = 16 and are unaffected</strong>, since 16^g divides 256^b exactly; no flags are changed for them. The fix is simple: sample the vinegar variables uniformly, e.g. by rejection sampling as QR-UOV does. The first version of the attack was found independently by an AI system (gpt-5.6-sol); the authors verified it, improved it and wrote it up."
  schemes: [SNOVA]

- date: '2026-09-04'
  type: update
  description: "HAETAE implementation 1.2.0 and the KS draft specifications 260825 (25 August 2026) and 260904 (4 September 2026), linked from the <a href=\"https://kpqc.cryptolab.co.kr/haetae\">HAETAE page</a>, revise the hyperball sampler: its discrete Gaussian CDT grows from 64 entries at 16-bit precision to 166 entries at 83-bit precision, so each sample candidate uses 203 instead of 136 random bits. The change follows a question by Jipeng Zhang (National University of Singapore) about the precision of the discrete Gaussian sampler, credited in specification 260904. Sizes are unchanged. We benchmark the 1.2.0 reference implementation (the release has no optimised code), fetched from the official download and pinned by its SHA-256; it reproduces the shipped KATs."
  schemes: [HAETAE]

- date: '2026-08-31'
  type: update
  description: "QR-UOV Round 3 submission (<a href=\"https://csrc.nist.gov/csrc/media/Projects/pqc-dig-sig/documents/qruov_specifications.pdf\">specification</a>, <a href=\"https://github.com/qruov/round3\">github.com/qruov/round3</a>): the parameter set list is cut from twelve to six, all with q = 127 &mdash; the q = 31 and q = 7 sets are dropped &mdash; and three new small-public-key sets with &#8467; = 10 are added (I-(127 540 60 10), III-(127 820 90 10), V-(127 1040 110 10)), e.g. an 11,041-byte public key at Level I for a 541-byte signature. The secret key is now the 32-byte seed alone at every level, and signing rejects oil systems of rank below m &minus; 2. A new AVX2 implementation (Amagasa, Ueno &amp; Homma, <a href=\"https://doi.org/10.46586/tches.v2026.i2.325-346\">TCHES 2026(2)</a>) replaces the Round 2 avx2/avx512 code. Benchmarks here switch to that AVX2 implementation with the AES-based public-seed PRG (upstream's default), so the speedup over Round 2 combines the new implementation with the SHAKE&rarr;AES PRG change."
  schemes: [QR-UOV]

- date: '2026-09-20'
  type: milestone
  description: "ICCS published the round-1 candidates of China's Next-generation Commercial Cryptographic Algorithms programme (NGCC): 34 signatures, 41 KEMs, 9 key exchanges and 35 hash functions. Submissions had closed on 30 June 2026. <a href=\"https://www.niccs.org.cn/en/\">NICCS</a>."
  programmes: [china-ngcc]

- date: '2026-09-08'
  type: update
  description: "SDitH round-3 update (v3.0.0, <a href=\"https://github.com/sdith/sdith/releases/tag/v3.0.0\">github.com/sdith/sdith</a>): the VOLEitH-based construction gets minor signature-size growth across all six gf2 parameter sets (Category I short/fast: 3705&rarr;3721 / 4484&rarr;4914 bytes; III: 7964&rarr;8484 / 9916&rarr;10852; V: 14121&rarr;15147 / 17540&rarr;19144), public-key sizes unchanged. Sizes verified against the tag's kat_r3 KAT vectors. A separate CIPHERPOW build variant is also introduced but not yet tracked here."
  schemes: [SDitH]

- date: '2026-09-07'
  type: update
  description: "UOV round-3 parameter update (<a href=\"https://github.com/pqov/pqov/commit/f82ec0a9\">pqov/pqov</a>): grows n at Levels I and III (Ip: n 112&rarr;119, m 44&rarr;45; III: n 184&rarr;193, m unchanged) and Level V (n 244&rarr;259, m unchanged), and adds a GFNI-optimized backend. Expanded-pk and signature sizes grow accordingly (compact-pk sizes are unchanged where m stayed fixed); Is (Level I, GF(16)) parameters are untouched. Not yet reflected on uovsig.org, which still serves the Feb-2025 round-2 package. Whether this fully re-addresses the intersection attack (Furue &amp; Ikematsu, ePrint 2026/298) at the new parameter sizes has not been independently re-analyzed, so existing broken/warning flags are carried forward unchanged pending that analysis."
  schemes: [UOV]

- date: '2026-09-01'
  type: update
  description: "SQIsign 3.0 released as the third-round submission spec: parameters revised in response to the improved supersingular isogeny-problem algorithm (ePrint 2026/1486), and the reference implementation drops its GMP dependency for a from-scratch fixed-precision integer library. Public key and signature sizes grow (level I: 65/148 &rarr; 83/200 bytes; level III: 97/224 &rarr; 129/306; level V: 129/292 &rarr; 169/406 bytes). On our benchmark (v3.0 with its x86-64 assembly field arithmetic vs. the v2.0.1 reference build) signing is faster at levels I and III (&minus;35% / &minus;9%) but slower at level V (+12%), and verification is 12&ndash;38% slower at every level."
  schemes: [SQIsign]

- date: '2026-09-01'
  type: update
  description: "FAEST v3.0.0 released (<a href=\"https://github.com/faest-sign/faest-ref/releases/tag/v3.0.0\">release notes</a>), the round-3 spec update. It restructures the VOLE-commitment construction around a new CRT-based scheme and, per <a href=\"https://github.com/faest-sign/faest-ref/issues/18\">issue #18</a>, aligns the spec text for the first Fiat-Shamir challenge (<code>chall_1</code>) with what the implementation already computed (no forgery or key-recovery &mdash; a transcript-binding clarification). Signature sizes shrink by roughly 10&ndash;15% across all parameter sets (e.g. 128s: 4506&rarr;4066 bytes, 256f: 26548&rarr;20856 bytes); public-key sizes are unchanged. v2.0 is not broken, just superseded as the pinned round-3 submission."
  schemes: [FAEST]

- date: '2026-08-31'
  type: update
  description: "SNOVA 3.0 (round-3 submission) reformulates the public map to support rectangular signature matrices, extending the scheme to seven parameters (v, o, q, l, r, m1, m2) and adding parameter sets over odd-characteristic fields. The recommended parameter sets (SNOVA_{I,III,V}_{K,B,S}) replace the previous v2.3 candidates; per the spec's security analysis (Tables 9&ndash;11), the Wedge product attack (Bros et al., ePrint 2026/237) that flagged several v2.3 parameter sets as broken/warning no longer applies to the reformulated public map. The &ldquo;Expanded Secret Key&rdquo; option is removed; only seeded secret keys remain."
  schemes: [SNOVA]

- date: '2026-08-31'
  type: update
  description: "MQOM v3.0 released (round-3 spec): adds a One-Tree (OT) BLC variant alongside the existing Correlated-Tree (CT) one (tighter security reduction to the MQ problem, similar sizes, less implementation-friendly), a new gf2-shorter variant, and drops the gf256 and three-round (*-r3) variants, leaving 18 parameter sets (3 tradeoffs &times; 2 BLC variants &times; 3 categories). Fixes the salt-less GGM root-expansion issue below (<a href=\"https://eprint.iacr.org/2026/1542\">ePrint 2026/1542</a>) via domain-separated root expansion, confirmed in the spec's changelog &mdash; the v2.1 warning is dropped for v3.0. Also expands F16 parameters for additional security margin and adds ARM NEON optimized implementations."
  schemes: [MQOM]

- date: '2026-08-31'
  type: update
  description: "MAYO published its round-3 spec (<a href=\"https://pqmayo.org/assets/specs/mayo-round3.pdf\">PDF</a>): MAYO2's parameters change to increase its margin against the Wedge attack (Ran, ePrint 2025/1143), shrinking its public key from 4912B to 2928B while growing its signature from 186B to 239B; MAYO1 grows slightly (pk 1420&rarr;1456B, sig 454&rarr;464B) to push the improved-MQ attack (Asanuma et al., ePrint 2026/1054) margin back above the NIST Level I threshold &mdash; both flags are dropped for the round-3 parameter sets. Also adds an explicit linear term to the verification equation to block a newly disclosed claw-finding forgery attack, and fixes a low-rank weakness in the whipping schedule. MAYO3 and MAYO5 sizes are unchanged. The team also widened MAYO2's margin further in response to a new, not-yet-public UOV-like key-recovery attack privately disclosed by Lars Ran and Simon-Philipp Merz shortly before the deadline."
  schemes: [MAYO]

- date: '2026-08-19'
  type: update
  description: "AIMer v3.0 (<a href=\"https://aimer-signature.org/docs/AIMer-specification-v3%20(Eng).pdf\">specification</a>, dated 31 July 2026) replaces AIM2 with AIM3, citing the Magic Pot attack: an IV-derived linear layer now precedes the first S-boxes (as proposed by Sun et al. for AIM2-patch) and the inverse Mersenne S-boxes become enhanced Mersenne S-boxes x^(2^e&minus;1) + x^(2^n&minus;2), whose quadratic relation only holds for non-zero inputs; key generation rejects keys with a zero S-box input. Parameter sets keep their names and public keys, but signatures grow by 13&ndash;25% (e.g. AIMer-128s 4,160&rarr;4,704 bytes, AIMer-256f 25,120&rarr;31,360 bytes). The specification no longer contains benchmarks, so no timings are shown for v3.0."
  schemes: [AIMer]

- date: '2026-08-07'
  type: attack
  description: "Passive full-key-recovery attack on MQOM v2 (Delgado, <a href=\"https://eprint.iacr.org/2026/1542\">ePrint 2026/1542</a>): the v2.x spec derives correlated GGM roots from a fresh master seed via a fixed, zero-salt PRG call (Algorithm 10), so repeated seeds across signatures, keys, and salts leak linear equations in the MQ witness. A parity-indexed XOR-collision attack recovers the complete signing key, but requires signature/query volumes at NIST's outer Q=2^64 permitted bound (~39% success in Category I) or substantial precomputation (tens of GiB&ndash;PiB of tables) to push higher; affects Categories I, III, and V, verified against every official tag from v2.0.0 through v2.1.1. Fix: salt-bound, domain-separated root expansion. v1.0 unaffected. Flagged as warning."
  schemes: [MQOM]

- date: '2026-07-29'
  type: milestone
  description: "The HAWK team withdrew HAWK from NIST's additional signature standardisation process, citing the key-recovery attack below: naïve fixes such as doubling parameters or moving to higher-rank modules make HAWK uncompetitive with other lattice signatures. NIST confirmed the withdrawal and updated the <a href=\"https://csrc.nist.gov/Projects/pqc-dig-sig/round-3-additional-signatures\">round-3 candidates page</a> accordingly. <a href=\"https://groups.google.com/a/list.nist.gov/g/pqc-forum/c/2r2u6SbHun4/m/0_I2KOZ_CQAJ\">pqc-forum announcement</a>."
  schemes: [HAWK]

- date: '2026-07-29'
  type: attack
  description: "Deterministic key-recovery attack (Straznickas &amp; Weis, Anthropic, <a href=\"https://www-cdn.anthropic.com/e8d50c167ad47beeb03d6109a4a484be95cb38ea/hawk_key_recovery.pdf\">paper</a>) reduces HAWK-n key recovery to poly(n) calls to an exact-SVP oracle in dimension n/2+1, using a second Galois involution (τ: ζ↦−ζ) beyond the complex conjugation prior module-LIP attacks relied on. Lowers key-recovery cost from 2^150 to 2^108 gates (HAWK-512) and from 2^288 to 2^182 gates (HAWK-1024), both below their NIST level thresholds. The smaller HAWK-256 challenge parameter set was fully broken in practice: secret key recovered end-to-end in a few hours on a single 96-core server. Falcon is unaffected. Flagged as broken."
  schemes: [HAWK]

- date: '2026-07-26'
  type: attack
  description: "Improved algorithm for the supersingular isogeny problem (<a href=\"https://eprint.iacr.org/2026/1486\">ePrint 2026/1486</a>) achieves time/memory p^{1/3+o(1)}, down from the previous best p^{1/2}. Relies on an unproven heuristic smoothness assumption and has a superpolynomial overhead plus high memory cost; concrete impact on SQIsign's parameters not yet clarified. Flagged as warning."
  schemes: [SQIsign]

- date: '2026-07-02'
  type: update
  description: "Added SMAUG-T (finalist algorithm selected in Korea's KpqC competition) to the KEMs comparison page, with benchmarked keygen/encaps/decaps timings for SMAUG-T128, SMAUG-T192, and SMAUG-T256."
  schemes: [SMAUG-T]

- date: '2026-07-02'
  type: update
  description: "Added NTRU+ (finalist algorithm selected in Korea's KpqC competition) to the KEMs comparison page, with benchmarked keygen/encaps/decaps timings for NTRU+768, NTRU+864, and NTRU+1152."
  schemes: [NTRU+]

- date: '2026-07-02'
  type: update
  description: "Added SABER (NIST round-3 finalist, not selected) to the KEMs comparison page, with benchmarked keygen/encaps/decaps timings for LightSaber, Saber, and FireSaber."
  schemes: [SABER]

- date: '2026-07-01'
  type: update
  description: "Published a standalone KEMs comparison page — public-key and ciphertext sizes plus keygen/encaps/decaps benchmarks for ML-KEM, HQC, and classical ECDH."

- date: '2026-06-04'
  type: attack
  description: "Improved MQ attack (Asanuma, Chen, Furue, Sakata &amp; Takagi, <a href=\"https://eprint.iacr.org/2026/1054\">ePrint 2026/1054</a>) reduces MAYO1 classical security estimate from 2^156 to 2^145. Still above NIST Level I threshold (128 bits); flagged as warning."
  schemes: [MAYO]

- date: '2026-05-26'
  type: update
  description: "Updated FAEST performance data to use the AVX2+AES-NI optimized implementation (<a href=\"https://github.com/faest-sign/faest-arch-opt\">faest-arch-opt</a>) instead of the reference implementation. Signing is 10–100× faster depending on the parameter set."
  schemes: [FAEST]

- date: '2026-05-26'
  type: update
  description: "Updated SNOVA to v2.3 (2026-04-03). Split round-2 and round-3 data: round-3 now shows the 14 current parameter sets from the v2.3 spec (l=4 variants retained with warnings, new q=19 variants, rectangular 4×5 structure added per \"Rectangular signatures\" update)."
  schemes: [SNOVA]

- date: '2026-05-14'
  type: milestone
  description: "NIST announced 9 Round 3 candidates for additional post-quantum signature schemes: FAEST, HAWK, MAYO, MQOM, QR-UOV, SDitH, SNOVA, SQIsign, UOV. Rationale in <a href=\"https://csrc.nist.gov/pubs/ir/8610/final\">NIST IR 8610</a>. <a href=\"https://csrc.nist.gov/projects/pqc-dig-sig/round-3-additional-signatures\">Round 3 candidates</a>."
  schemes: [FAEST, HAWK, MAYO, MQOM, QR-UOV, SDitH, SNOVA, SQIsign, UOV]

- date: '2026-05-09'
  type: attack
  description: "Updated UOV security flags based on pℓ-truncated polynomial ring intersection attack (Furue &amp; Ikematsu, <a href=\"https://eprint.iacr.org/2026/298\">ePrint 2026/298</a>). Improves on Ran's wedge attack for Ip (~128 bits), III (~182 bits), V (~223 bits). Is parameter sets newly flagged as warning (~159 bits, still above threshold)."
  schemes: [UOV]

- date: '2026-05-09'
  type: attack
  description: "Updated UOV and MAYO security flags based on wedge attack (Ran, <a href=\"https://eprint.iacr.org/2025/1143\">ePrint 2025/1143</a>). MAYO-2 (\"two\") marked broken (~113 bits, below 128-bit threshold). UOV Ip, III, and V parameter sets marked with warning (reduced but still above threshold). UOV Is unaffected."
  schemes: [UOV, MAYO]

- date: '2026-05-09'
  type: attack
  description: "Updated SNOVA security flags based on wedge product attack (Bros et al., <a href=\"https://eprint.iacr.org/2026/237\">ePrint 2026/237</a>). 6 parameter sets marked broken: (37 17 2), (25 8 3), (56 25 2), (24 5 5), (75 33 2), (29 6 5). 2 parameter sets marked with warning: (24 5 4), (37 8 4)."
  schemes: [SNOVA]

- date: '2026-05-08'
  type: update
  description: Updated 7 schemes to their latest published specifications. PERK redesigned parameter sets (v2.2.0). MQOM adds gf16 variants (v2.1). RYDE and Mirath corrected signature sizes and added faster variants. CROSS, SQIsign, and MAYO updated with revised benchmarks.
  schemes: [CROSS, MAYO, MQOM, Mirath, PERK, RYDE, SQIsign]

- date: '2026-05-08'
  type: attack
  description: "Magic Pot (Biryukov, Garc&iacute;a Fern&aacute;ndez &amp; Udovenko, <a href=\"https://eprint.iacr.org/2026/903\">ePrint 2026/903</a>, EUROCRYPT 2026): a new algebraic elimination framework recovers AIM2 keys from a single public key in 2^103.66, 2^147.46 and 2^213.19 encryptions for AIM2-I, -III and -V, below the claimed 128, 192 and 256 bits. If one secret key is reused under several IVs, or keys are related, key recovery becomes practical and was run: 11, 20 and 52 public keys in about 33, 30 and 37 hours. This affects AIMer v2.0 and v2.1; the AIMer team replaced AIM2 by AIM3 in v3.0 in response."
  schemes: [AIMer]

- date: '2026-05-07'
  type: update
  description: Fixed some typos in scheme data. <a href="https://github.com/PQShield/nist-sigs-zoo/commit/355b685ab03fa8f51b8bd1fec2b17e46ed701ffa">commit</a>

- date: '2026-05-07'
  type: update
  description: Website rewritten with SvelteKit, Tailwind CSS v4, and a new round selector, filter panel, and scatter plot.

- date: '2026-02-04'
  type: update
  description: "HAETAE KS draft specification 260204 with implementation 1.1.2 (<a href=\"https://github.com/CryptoLabInc/HAETAE\">CryptoLabInc/HAETAE</a>), prepared for Korean standardisation, renames the parameter sets HAETAE-120/180/260 to HAETAE-2/3/5 after their NIST levels. Sizes are those of v3.0."
  schemes: [HAETAE]

- date: '2025-12-18'
  type: attack
  description: "Sun, Chen, Liu, Wang &amp; Niu (<a href=\"https://eprint.iacr.org/2025/2272\">ePrint 2025/2272</a>) give resultant-based algebraic attacks on AIM2: 2^188.76 primitive calls for AIM2-III with &omega; = 2 (2^195.05 with &omega; = 2.373), against 192 claimed bits, and 2^295.97 for AIM2-V via subfield reduction, about 2^100 below the designers&rsquo; Gr&ouml;bner-basis estimate but above 256 bits. They propose AIM2-patch, which adds a linear layer after the key. The AIMer team&rsquo;s January 2026 specification counts these attacks at more than an exhaustive search of AES at the same level. No flag change."
  schemes: [AIMer]

- date: '2025-01-16'
  type: milestone
  description: "KpqC <a href=\"https://groups.google.com/g/kpqc-bulletin/c/FSqdwf4WcXc\">announced its final algorithms</a>: AIMer and HAETAE (signatures), NTRU+ and SMAUG-T (KEMs). AIMer was then at v2.1."
  schemes: [AIMer, HAETAE, SMAUG-T, NTRU+]
  programmes: [kpqc]

- date: '2024-07-12'
  type: update
  description: "AIMer v2.1 (<a href=\"https://aimer-signature.org/docs/AIMer-specification-v2.1.pdf\">specification</a>, <a href=\"https://groups.google.com/g/kpqc-bulletin/c/QicD0wIDrAU\">announcement</a>): implementation-only changes (PQClean compatibility, a memory-optimised C implementation, ARM SHAKE optimisation, and constant-time patches recommended by D. J. Bernstein). Sizes are unchanged from v2.0."
  schemes: [AIMer]

- date: '2024-07-04'
  type: update
  description: "HAETAE v3.0 (<a href=\"https://hmchoe0528.github.io/assets/manuscripts/HAETAE_spec_24.07.04_v3.0.pdf\">specification</a>) corrects the secret-key sizes, which were missing 32 bytes (HAETAE-120 1,376&rarr;1,408 bytes), lowers B&prime; by 0.01 to satisfy Lemma 5, and replaces the 512-point FFT in key generation by a 256-point FFT (40&ndash;60% fewer key-generation cycles in AVX2). This is the version KpqC selected in January 2025."
  schemes: [HAETAE]

- date: '2024-02-23'
  type: update
  description: "AIMer v2.0 (<a href=\"https://aimer-signature.org/docs/AIMer-specification-v2.0.pdf\">specification</a>), the KpqC round-2 submission, replaces AIM with AIM2 (<a href=\"https://eprint.iacr.org/2023/1474\">Kim, Ha, Son &amp; Lee, ePrint 2023/1474</a>) to counter the 2023 attacks on AIM: inverse Mersenne S-boxes in the first round and a distinct constant added before each S-box. It also halves the salt, adds message pre-hashing and cuts the twelve parameter sets to six (AIMer-128f/s, -192f/s, -256f/s). Signatures at the same level are similar in size to v1.0 (e.g. 4,160 bytes for AIMer-128s against 4,176 bytes for L1_PARAM3)."
  schemes: [AIMer]

- date: '2024-02-23'
  type: update
  description: "HAETAE v2.1 (<a href=\"https://hmchoe0528.github.io/assets/manuscripts/HAETAE_spec_24.02.23_v2.1.pdf\">specification</a>) adds an HVZK argument for compressed HAETAE, a precise security bound with refined MLWE estimates, and a list of reported attacks and fixes. Parameters and sizes are unchanged."
  schemes: [HAETAE]

- date: '2023-11-29'
  type: update
  description: "HAETAE v2.0 (<a href=\"https://hmchoe0528.github.io/assets/manuscripts/HAETAE_spec_23.11.29_v2.0.pdf\">specification</a>), the KpqC round-2 submission, fixes the implementation errors behind the buffer-overflow (Saarinen) and rANS bit-flipping (HuFu team) forgeries of v1.0 and an uninitialised sum in the hyperball sampler, and changes the HAETAE-120/180 parameters to account for verification-key compression: signatures grow from 1,463/2,337/2,908 to 1,474/2,349/2,948 bytes. It adds AVX2 and Cortex-M4 implementations."
  schemes: [HAETAE]

- date: '2023-09-18'
  type: attack
  description: "Zhang, Wang, Yu, Guo &amp; Cui (<a href=\"https://eprint.iacr.org/2023/1397\">ePrint 2023/1397</a>, ASIACRYPT 2023) attack full AIM-III in 2^186.5 encryptions, below its 192-bit target, by exploiting the algebraic structure of its power-function S-boxes."
  schemes: [AIMer]

- date: '2023-07-20'
  type: attack
  description: "Liu, Mahzoun, &Oslash;ygarden &amp; Meier (<a href=\"https://eprint.iacr.org/2023/1133\">ePrint 2023/1133</a>, ToSC 2023(4)) find equivalent representations of full AIM that admit fast exhaustive search, recovering AIM-I/III/V keys in 2^136.2/2^200.7/2^265 bit operations, about 2^115/2^178/2^241 AIM evaluations. AIM therefore misses the NIST levels claimed by AIMer v1.0."
  schemes: [AIMer]
