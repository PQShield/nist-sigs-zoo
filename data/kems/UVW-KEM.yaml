name: UVW KEM
full_name: UVW Key Encapsulation Mechanism
website: https://www.niccs.org.cn/niccs/Round1Additional/pc/content/content_2101560881697083392.html
category: Code-based
assumption: SD, (U+V,U+W) code distinguishing
status: NGCC round 1
programmes:
  china-ngcc: round-1
parametersets:
- name: UVW-KEM-128
  ngcc_level: 128
  recommended: true
  pk: 208013
  ct: 1032
  keygen_cycles: 761148597
  encaps_cycles: 741296
  decaps_cycles: 1656684394
  keygen_us: 196841.4
  encaps_us: 192.0
  decaps_us: 428075.4
  bench_env: 2026-10-16-c8i.4xlarge
  notes: Reference implementation; uses the ICCS placeholder hash/XOF (pseudohash/pseudoXOF) from the submission package; any timings include it.
  implementation: Unused ciphertext bits in the submitted code let altered ciphertexts decapsulate to the same key (<a href="https://ngcc.dev/reports/kem-38.html#kem-38-4-unused-c1-bits-make-ciphertexts-malleable-without-changing-the-key">Saarinen</a>).
  broken: The cubic-jet method of <a href="https://eprint.iacr.org/2026/1630">Ghoshal, Ishai, Jain and Sun</a> and of <a href="https://eprint.iacr.org/2026/1984">Weis</a>, applied to shortened public codes, recovers an equivalent decapsulation key from the public key alone in under a minute (<a href="https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/D2DTPPLQWKGE3QZQCTDEMXYPKPGHXH4A/">Liping Wang</a>; key recovery by <a href="https://ngcc.dev/reports/kem-38.html#kem-38-8-cubic-jet-syzygies-recover-uvws-secret-structure-from-the-public-key">Saarinen</a>).
- name: UVW-KEM-256
  ngcc_level: 256
  recommended: true
  pk: 911645
  ct: 2199
  keygen_cycles: 5830472326
  encaps_cycles: 2276636
  decaps_cycles: 11434982964
  keygen_us: 1518611.4
  encaps_us: 588.3
  decaps_us: 2972888.0
  bench_env: 2026-10-16-c8i.4xlarge
  notes: Reference implementation; uses the ICCS placeholder hash/XOF (pseudohash/pseudoXOF) from the submission package; any timings include it.
  broken: The same cubic-jet method distinguishes the public key from a random code, refuting the code-distinguishing assumption. Key recovery was not run at this size and is estimated at 2^57.75 bit operations (<a href="https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/D2DTPPLQWKGE3QZQCTDEMXYPKPGHXH4A/">Liping Wang</a>; distinguisher confirmed by <a href="https://ngcc.dev/reports/kem-38.html#kem-38-8-cubic-jet-syzygies-recover-uvws-secret-structure-from-the-public-key">Saarinen</a>).
- name: UVW-KEM-512
  ngcc_level: 512
  recommended: true
  pk: 4001850
  ct: 4820
  keygen_cycles: 45922175008
  encaps_cycles: 17947380
  decaps_cycles: 75358985788
  keygen_us: 11979217.2
  encaps_us: 4705.5
  decaps_us: 19605616.8
  bench_env: 2026-10-16-c8i.4xlarge
  notes: Reference implementation; uses the ICCS placeholder hash/XOF (pseudohash/pseudoXOF) from the submission package; any timings include it.
  implementation: Unused ciphertext bits let altered ciphertexts decapsulate to the same key (<a href="https://ngcc.dev/reports/kem-38.html#kem-38-4-unused-c1-bits-make-ciphertexts-malleable-without-changing-the-key">Saarinen</a>). The encryption pair derives from only 256 bits, below the target (<a href="https://ngcc.dev/reports/kem-38.html#kem-38-1-uvw-512-derives-its-encryption-pair-from-only-256-bits">Saarinen</a>).
  broken: This set has the structure that the cubic-jet method breaks at UVW-KEM-128 from the public key alone. No step was run at this size. Key recovery is estimated at 2^61.56 bit operations (<a href="https://list.niccs.org.cn/archives/list/pkcforum@list.niccs.org.cn/message/D2DTPPLQWKGE3QZQCTDEMXYPKPGHXH4A/">Liping Wang</a>).
findings_url: https://ngcc.dev/reports/kem-38.html
