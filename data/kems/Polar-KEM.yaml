implementation: The submitted code includes functions that derive the shared secret from public data alone (<a href="https://ngcc.dev/reports/kem-29.html#kem-29-1-the-submission-ships-a-complete-public-key-only-break">Saarinen</a>).
broken: The specified basis exposes the secret transformation, so the key can be recovered from the public key in polynomial time (<a href="https://eprint.iacr.org/2026/2211">Xiao et al.</a>).
