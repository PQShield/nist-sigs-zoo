name: Classic McEliece
website: https://classic.mceliece.org/
category: Code-based
assumption: Syndrome Decoding (disguised binary Goppa)
status: ISO standardisation
info: Code-based KEM based on the difficulty of decoding a disguised binary Goppa code. Public keys are enormous (255 KB–1.3 MB) but ciphertexts are tiny. Key generation is variable-time and slow. The five base parameter sets are shown; libmceliece also offers f (fast-keygen), pc and pcf variants. Selected for ISO standardisation; also a NIST round-4 candidate.
broken: 'Quasipolynomial-time "hold-out" key-recovery attack (eprint 2026/1984, improving on eprint 2026/1630) reduces classical security of all parameter sets to well below NIST Level 1 threshold. Repairing the scheme requires impractical public key sizes.'
