- name: mceliece348864
  broken: 'Heuristic key recovery, building on the distinguisher of <a href="https://eprint.iacr.org/2026/1630">Ghoshal, Ishai, Jain and Sun</a>, costs 2^107 to 2^117 bit operations once memory is charged (<a href="https://eprint.iacr.org/2026/1984">Weis</a>), below the 2^143 of category 1. <a href="https://eprint.iacr.org/2026/1786">Saarinen</a>''s itemised count gives 2^127. No key of a Classic McEliece parameter set has been recovered. <a href="https://groups.google.com/a/list.nist.gov/g/pqc-forum/c/2kfyUnLObWQ">Bernstein</a> argues that counts of bit operations ignore the cost of moving data, which dominates these attacks. No estimate in that model has been published.'
