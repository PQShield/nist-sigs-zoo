name: Classic McEliece
website: https://classic.mceliece.org/
category: Code-based
assumption: Syndrome Decoding (binary Goppa)
status: ISO standard
programmes:
  nist-pqc: round-4
  iso: published
info: Conservative code-based KEM with a very long security track record. Public keys are enormous (255 KB–1.3 MB) but ciphertexts are tiny. Key generation is variable-time and slow. The five base parameter sets are shown; libmceliece also offers f (fast-keygen), pc and pcf variants. Standardised in ISO/IEC 18033-2:2006/Amd 2:2026 (June 2026), which includes the 460896, 6688128, 6960119 and 8192128 families (with f, pc and pcf variants) but not mceliece348864; also a NIST round-4 candidate.
# Not flagged: the team's "we recommend the mceliece6* sizes for long-term security" (https://classic.mceliece.org/iso.html) is a conservative choice, not a ranking of the other sets, so every set is shown as recommended.
