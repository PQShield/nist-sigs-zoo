name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork PRs get no secrets, so they can't deploy
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Served at the root of its own pages.dev hostname, so no BASE_PATH
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nist-sigs-zoo --branch=pr-${{ github.event.number }}

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            Preview: ${{ steps.deploy.outputs.pages-deployment-alias-url }}

            This commit (${{ github.event.pull_request.head.sha }}): ${{ steps.deploy.outputs.deployment-url }}
