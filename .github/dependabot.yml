version: 2
updates:
  # Site toolchain and the one runtime dependency (vega-embed). Minor and patch
  # updates arrive as one weekly PR; majors get their own PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

# Not covered on purpose: the benchmarked scheme sources (git submodules and
# pinned tarballs under bench*/schemes) are pinned to the exact versions we
# measure and are updated by hand (see the updating-scheme-versions skill).
