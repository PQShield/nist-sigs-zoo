version: 2
updates:
  # Site toolchain and the one runtime dependency (vega-embed): all updates,
  # majors included, arrive batched as one weekly PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # SvelteKit 3 requires typescript@^6; TypeScript 7 fails npm ci with
      # ERESOLVE. Drop this once @sveltejs/kit accepts TypeScript 7 (#72).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

# Not covered on purpose: the benchmarked scheme sources (git submodules and
# pinned tarballs under bench*/schemes) are pinned to the exact versions we
# measure and are updated by hand (see the updating-scheme-versions skill).
